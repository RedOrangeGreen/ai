<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050816" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A simple free and anonymous ToDo List manager. Save and load lists locally in XML or JSON." />
  <meta name="robots" content="index, follow" />
  <meta name="view-transition" content="same-origin" />
  <meta property="og:title" content="Todo List" />
  <meta property="og:description" content="A simple free and anonymous ToDo List manager. Save and load lists locally in XML or JSON." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AI Playground" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Todo List" />
  <meta name="twitter:description" content="A simple free and anonymous ToDo List manager. Save and load lists locally in XML or JSON." />
  <title>Todo List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous" />

  <style>
    @layer reset, base, components, utilities;

    @layer base {
      :root {
        accent-color: #38bdf8;
        interpolate-size: allow-keywords;
        --bg-body: #050816;
        --bg-elevated: #0b1020;
        --bg-elevated-soft: #0f172a;
        --accent: #38bdf8;
        --accent-soft: rgba(56,189,248,0.15);
        --accent-strong: #0ea5e9;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --border-subtle: rgba(148,163,184,0.25);
        --radius-lg: 18px;
        --radius-pill: 999px;
        --shadow-soft: 0 18px 45px rgba(15,23,42,0.85);
        --shadow-subtle: 0 10px 30px rgba(15,23,42,0.7);
        --transition-fast: 0.18s ease-out;
      }
    }

    body {
      background: radial-gradient(circle at top, #1d283a 0, #020617 55%, #000 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3.5rem;
    }

    .hero-title {
      font-size: clamp(2rem, 3vw + 1rem, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .hero-title span {
      background: linear-gradient(120deg, #38bdf8, #a855f7, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      line-height: 1.6;
    }

    .card {
      padding: 1.4rem 1.6rem;
      border-radius: var(--radius-lg);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-subtle);
      margin-bottom: 1.5rem;
    }

    .add-row {
      display: flex;
      gap: 0.6rem;
    }

    .add-row input {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .add-row input:focus {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .add-row input::placeholder {
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: var(--radius-pill);
      padding: 0.5rem 1.1rem;
      font-size: 0.88rem;
      border: none;
      background: linear-gradient(120deg, #38bdf8, #0ea5e9);
      color: #0b1120;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease, filter 0.25s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 35px rgba(8, 47, 73, 0.9);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn-sm {
      padding: 0.3rem 0.75rem;
      font-size: 0.78rem;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      box-shadow: none;
    }

    .btn-ghost:hover {
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
      box-shadow: none;
      transform: translateY(-1px);
    }

    .btn-ghost.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }

    .btn-active {
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0;
      transition: color var(--transition-fast);
    }
    .btn-back:hover { color: var(--accent); }

    .report-dropdown-wrap { position: relative; display: inline-flex; }
    .report-dropdown-menu {
      display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.98); border: 1px solid var(--border-subtle);
      border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      padding: 0.3rem; min-width: 140px; z-index: 100;
    }
    .report-dropdown-menu.open { display: block; }
    .report-dropdown-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.75rem; border-radius: 8px;
      font-size: 0.82rem; color: var(--text-muted); cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease; border: none;
      background: none; width: 100%; text-align: left; font-family: inherit;
    }
    .report-dropdown-item:hover { background: rgba(56,189,248,0.1); color: var(--accent); }
    .report-dropdown-item i { width: 1rem; }

    .todo-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .todo-stats .count {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: var(--radius-pill);
      padding: 0.2rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 500;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item.dragging {
      opacity: 0.2;
      transform: scale(0.96);
    }

    .todo-item.drag-over-before::before,
    .todo-item.drag-over-after::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .todo-item.drag-over-before::before {
      top: -2px;
    }
    .todo-item.drag-over-after::after {
      bottom: -2px;
    }
    .todo-item.drag-over-before {
      border-top-color: transparent;
    }

    .todo-item .todo-drag {
      cursor: grab;
      color: rgba(148, 163, 184, 0.25);
      font-size: 0.8rem;
      padding: 0.2rem;
      flex-shrink: 0;
      transition: color 0.2s ease;
      user-select: none;
    }

    .todo-item .todo-drag:hover {
      color: rgba(148, 163, 184, 0.6);
    }

    .todo-item .todo-drag:active {
      cursor: grabbing;
    }

    .todo-item .todo-number {
      font-size: 0.72rem;
      color: var(--text-muted);
      min-width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .todo-item .todo-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo-item .todo-text.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-item .todo-check {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 2px solid rgba(148, 163, 184, 0.4);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
      color: transparent;
      font-size: 0.6rem;
    }

    .todo-item .todo-check i { opacity: 0; transition: opacity 0.2s ease; }

    .todo-item .todo-check.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1120;
    }

    .todo-item .todo-check.checked i { opacity: 1; }

    .todo-item .todo-delete {
      background: none;
      border: none;
      color: rgba(148, 163, 184, 0.4);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem;
      transition: color 0.2s ease;
      flex-shrink: 0;
    }

    .todo-item .todo-delete:hover {
      color: #ef4444;
    }

    .todo-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .filter-row {
      display: flex;
      gap: 0.4rem;
    }

    .todo-list.hide-numbers .todo-number { display: none; }

    .filter-row .btn-filter {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .filter-row .btn-filter:hover {
      color: var(--accent);
    }

    .filter-row .btn-filter.active {
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
    }

    footer {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-body); }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.4); }

    ::selection { background: rgba(56,189,248,0.3); color: #fff; }

    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      padding: 1.6rem 1.8rem;
      max-width: 400px;
      width: 90%;
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 {
      margin: 0 0 0.6rem;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .modal-box p {
      margin: 0 0 1.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .btn:hover { transform: none; }
    }

    @media print {
      body { background: #fff !important; color: #111 !important; }
      .btn, .btn-back, #addBtn, footer { display: none !important; }
      .card { border: 1px solid #ddd !important; box-shadow: none !important; }
      .hero-title span { color: #111 !important; -webkit-background-clip: unset; background-clip: unset; background: none; }
      input { display: none !important; }
      .todo-item .todo-check { border-color: #999 !important; }
      .todo-item .todo-check.checked { background: #111 !important; }
    }

    .format-toggle {
      display: inline-flex;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      font-size: 0.75rem;
    }
    .format-toggle button {
      background: transparent;
      border: none;
      padding: 0.25rem 0.65rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .format-toggle button.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
    }
    .format-toggle button:hover:not(.active) {
      color: var(--text-main);
    }

    @media (max-width: 480px) {
      .card { padding: 1rem; }
      .page-shell { padding: 1rem 0.75rem 2rem; }
      .add-row { flex-direction: column; }
    }
    html { scroll-behavior: smooth; overscroll-behavior: none; }
    * { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,0.25) var(--bg-body); }
    h1, h2, h3, p { text-wrap: pretty; }
    .search-wrap {
      position: relative; margin-bottom: 0.8rem;
    }
    .search-wrap i {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 0.85rem; pointer-events: none;
    }
    .search-tasks {
      width: 100%; border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle); background: rgba(15,23,42,0.9);
      color: var(--text-main); padding: 0.5rem 0.85rem 0.5rem 2.2rem;
      font-size: 0.85rem; outline: none; box-sizing: border-box;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-tasks::placeholder { color: var(--text-muted); }
    .search-tasks:focus {
      border-color: rgba(56,189,248,0.5);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
    }
    .completion-bar {
      height: 6px; border-radius: 999px; background: rgba(148,163,184,0.12);
      overflow: hidden; margin-bottom: 0.6rem;
    }
    .completion-bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.4s ease;
    }
    .stats-breakdown {
      display: flex; gap: 0.8rem; font-size: 0.78rem; color: var(--text-muted);
      flex-wrap: wrap;
    }
    .stats-breakdown .done-count { color: #22c55e; }
    .stats-breakdown .pending-count { color: #f97316; }
    .shortcut-help {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem;
      font-size: 0.7rem; color: rgba(148,163,184,0.5);
    }
    .shortcut-help kbd {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.65rem;
      background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.25);
      color: rgba(148,163,184,0.7); font-family: inherit; min-width: 1rem;
    }
    .back-to-top {
      position: fixed; bottom: 2rem; right: 2rem; width: 44px; height: 44px;
      border-radius: 999px; border: none;
      background: linear-gradient(120deg, #38bdf8, #0ea5e9); color: #0b1120;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(8,47,73,0.6);
      opacity: 0; transform: translateY(16px) scale(0.9);
      transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1000; pointer-events: none;
    }
    .back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .back-to-top:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 32px rgba(8,47,73,0.8); }

    .card { container-type: inline-size; container-name: card; }
    @container card (max-width: 400px) {
      .add-row { flex-direction: column; }
      .todo-stats { flex-direction: column; align-items: flex-start; }
      .stats-breakdown { width: 100%; }
    }
    input { field-sizing: content; }
    @media (prefers-contrast: more) {
      .todo-item { border-bottom-width: 2px; }
      .search-tasks { border-width: 2px; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .modal-overlay { backdrop-filter: none !important; background: rgba(2, 6, 23, 0.97); }
    }
    .skip-link {
      position: absolute; top: -999px; left: 0.5rem; z-index: 9999;
      background: #0b1120; color: var(--accent); padding: 0.5rem 1rem;
      border-radius: 0 0 8px 8px; font-size: 0.9rem; font-weight: 600;
      text-decoration: none; border: 1px solid var(--accent); border-top: none;
    }
    .skip-link:focus { top: 0; }
    .noscript-notice {
      margin: 0 auto 1rem; max-width: 640px; padding: 0.9rem 1.1rem;
      border-radius: 12px; background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.35); color: var(--text-main);
      font-size: 0.85rem; line-height: 1.5;
    }
    section[id], h1[id], h2[id], h3[id], #main-content { scroll-margin-top: 1.5rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <noscript><div class="noscript-notice" role="note">This page requires JavaScript to render its interactive content. Please enable JavaScript to continue.</div></noscript>
  <main id="main-content" class="page-shell">
    <div style="margin-bottom:0.5rem;">
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
    </div>
    <h1 class="hero-title"><span>Todo List</span></h1>
    <p class="hero-subtitle">A simple free and anonymous ToDo List manager. Lists saved and loaded locally.</p>

    <div class="card">
      <div class="add-row">
        <label for="todoInput" class="sr-only">New task</label>
        <input type="text" id="todoInput" placeholder="Add a new task..." spellcheck="false" autocomplete="off" />
        <button class="btn" id="addBtn" title="Add a new task to the list"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
    </div>

    <div class="card">
      <div class="todo-stats">
        <span><span class="count"><span id="totalCount">0</span> total</span></span>
        <div class="stats-breakdown">
          <span class="done-count" id="doneCount">0 done</span>
          <span class="pending-count" id="pendingCount">0 pending</span>
          <span id="completionPct" style="color:var(--accent);font-weight:500;">0%</span>
        </div>
        <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm btn-ghost" id="deleteAllDoneBtn" title="Remove all tasks marked as done"><i class="fa-solid fa-check-double"></i> Delete Completed</button>
          <button class="btn btn-sm btn-ghost" id="sortBtn" title="Sort all tasks in alphabetical order"><i class="fa-solid fa-arrow-down-a-z"></i> Sort</button>
          <button class="btn btn-sm btn-ghost" id="numbersToggle" title="Show or hide task numbers"><i class="fa-solid fa-list-ol"></i> Numbers</button>
          <button class="btn btn-sm btn-ghost" id="deleteAllBtn" title="Permanently remove every task"><i class="fa-solid fa-trash-can"></i> Delete All</button>
        </div>
      </div>
      <div class="completion-bar"><div class="completion-bar-fill" id="completionBar" style="width:0%"></div></div>
      <search class="search-wrap">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="text" id="searchTasks" class="search-tasks" placeholder="Search tasks…" aria-label="Search tasks" spellcheck="false" autocomplete="off" />
      </search>
      <ul class="todo-list" id="todoList" role="list"></ul>
      <div class="todo-empty" id="emptyMsg">Nothing here yet. Add a task above!</div>
      <div class="todo-empty" id="noMatchMsg" style="display:none;">No tasks match your search.</div>
      <div class="shortcut-help">
        <span><kbd>Enter</kbd> Add task</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> Reorder</span>
        <span><kbd>Space</kbd> Toggle done</span>
      </div>
      <div id="srLive" class="sr-only" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>
    </div>

    <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;align-items:center;">
      <div class="format-toggle" id="formatToggle">
        <button class="active" data-format="xml" title="Save files in XML format">XML</button>
        <button data-format="json" title="Save files in JSON format">JSON</button>
      </div>
      <button class="btn btn-sm btn-ghost" id="saveXmlBtn" title="Download the current todo list to a file"><i class="fa-solid fa-download"></i> Save</button>
      <button class="btn btn-sm btn-ghost" id="loadXmlBtn" title="Import a todo list from an XML or JSON file"><i class="fa-solid fa-upload"></i> Load</button>
      <div class="report-dropdown-wrap">
        <button class="btn btn-sm btn-ghost" id="reportBtn" title="Generate a summary report of your tasks"><i class="fa-solid fa-file-lines"></i> Create report <i class="fa-solid fa-caret-up"></i></button>
        <div class="report-dropdown-menu" id="reportDropdown">
          <button class="report-dropdown-item" data-format="html" title="Download report as an HTML page"><i class="fa-solid fa-file-code"></i> HTML</button>
          <button class="report-dropdown-item" data-format="txt" title="Download report as plain text"><i class="fa-solid fa-file-lines"></i> TXT</button>
          <button class="report-dropdown-item" data-format="pdf" title="Download report as a PDF document"><i class="fa-solid fa-file-pdf"></i> PDF</button>
        </div>
      </div>
      <input type="file" id="xmlFileInput" accept=".xml,.json" style="display:none" />

    </div>

    <footer>
      <span>AI generated <span id="footerDate"></span>.</span>
    </footer>
  </main>

  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <p id="modalMessage"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'todos';

      let todos = [];
      let showNumbers = true;
      let draggedId = null;
      let saveFormat = 'xml';
      let searchQuery = '';

      const todoList = document.getElementById('todoList');
      const emptyMsg = document.getElementById('emptyMsg');
      const noMatchMsg = document.getElementById('noMatchMsg');
      const totalCount = document.getElementById('totalCount');
      const doneCount = document.getElementById('doneCount');
      const pendingCount = document.getElementById('pendingCount');
      const completionPct = document.getElementById('completionPct');
      const completionBar = document.getElementById('completionBar');
      const todoInput = document.getElementById('todoInput');
      const addBtn = document.getElementById('addBtn');
      const deleteAllDoneBtn = document.getElementById('deleteAllDoneBtn');
      const deleteAllBtn = document.getElementById('deleteAllBtn');
      const sortBtn = document.getElementById('sortBtn');
      const reportBtn = document.getElementById('reportBtn');
      const searchTasks = document.getElementById('searchTasks');
      const backToTop = document.getElementById('backToTop');

      const saveXmlBtn = document.getElementById('saveXmlBtn');
      const loadXmlBtn = document.getElementById('loadXmlBtn');
      const xmlFileInput = document.getElementById('xmlFileInput');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const modalMessage = document.getElementById('modalMessage');
      const modalActions = document.getElementById('modalActions');
      const srLive = document.getElementById('srLive');
      function announce(msg) { srLive.textContent = ''; setTimeout(function() { srLive.textContent = msg; }, 50); }

      function loadTodos() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          todos = data ? JSON.parse(data) : [];
          todos.forEach(function(t) { if (typeof t.id !== 'string') t.id = String(t.id); });
        } catch { todos = []; }
        try { showNumbers = localStorage.getItem('showNumbers') !== 'false'; } catch {}
      }

      function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function render() {
        todoList.innerHTML = '';
        todoList.classList.toggle('hide-numbers', !showNumbers);
        var nt = document.getElementById('numbersToggle');
        if (nt) nt.classList.toggle('btn-active', showNumbers);

        var filtered = todos;
        if (searchQuery) {
          var q = searchQuery.toLowerCase();
          filtered = todos.filter(function(t) { return t.text.toLowerCase().indexOf(q) !== -1; });
        }
        noMatchMsg.style.display = (filtered.length === 0 && todos.length > 0 && searchQuery) ? 'block' : 'none';

        filtered.forEach(function(todo) {
          var i = todos.indexOf(todo);
          const li = document.createElement('li');
          li.className = 'todo-item';
          li.draggable = true;
          li.tabIndex = 0;
          li.setAttribute('role', 'listitem');
          li.dataset.id = todo.id;

          const drag = document.createElement('span');
          drag.className = 'todo-drag';
          drag.innerHTML = '<i class="fa-solid fa-grip-vertical"></i>';
          drag.setAttribute('aria-label', 'Drag to reorder');

          const number = document.createElement('span');
          number.className = 'todo-number';
          number.textContent = '#' + (i + 1);

          const check = document.createElement('span');
          check.className = 'todo-check' + (todo.done ? ' checked' : '');
          check.innerHTML = '<i class="fa-solid fa-check"></i>';
          check.setAttribute('role', 'checkbox');
          check.setAttribute('aria-checked', todo.done);
          check.setAttribute('tabindex', '0');
          check.addEventListener('click', () => toggleTodo(todo.id));
          check.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTodo(todo.id); }
          });

          const text = document.createElement('span');
          text.className = 'todo-text' + (todo.done ? ' done' : '');
          text.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'todo-delete';
          del.innerHTML = '<i class="fa-solid fa-xmark"></i>';
          del.setAttribute('aria-label', 'Delete task');
          del.addEventListener('click', (e) => { e.stopPropagation(); deleteTodo(todo.id); });

          li.appendChild(drag);
          li.appendChild(number);
          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(del);
          todoList.appendChild(li);

          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragend', onDragEnd);
          li.addEventListener('dragover', onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop', onDrop);
          li.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
              e.preventDefault();
              var idx = todos.findIndex(function(t) { return t.id === todo.id; });
              if (idx === -1) return;
              var dir = e.key === 'ArrowUp' ? -1 : 1;
              var newIdx = idx + dir;
              if (newIdx < 0 || newIdx >= todos.length) return;
              var m = todos.splice(idx, 1)[0];
              todos.splice(newIdx, 0, m);
              render();
              var movedEl = todoList.querySelector('[data-id="' + todo.id + '"]');
              if (movedEl) movedEl.focus();
            }
            if (e.key === ' ' || e.key === 'Spacebar' || e.code === 'Space') {
              e.preventDefault();
              toggleTodo(todo.id);
            }
          });
        });

        updateUI();
        saveTodos();
      }

      function onDragStart(e) {
        const li = e.target.closest('.todo-item');
        if (!li) return;
        draggedId = li.dataset.id;
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', li.dataset.id);
        setTimeout(function() {
          li.style.display = 'none';
        }, 0);
      }

      function onDragEnd(e) {
        const li = e.target.closest('.todo-item');
        if (li) {
          li.classList.remove('dragging');
          li.style.display = '';
        }
        document.querySelectorAll('.todo-item.drag-over-before, .todo-item.drag-over-after').forEach(function(el) {
          el.classList.remove('drag-over-before', 'drag-over-after');
        });
        draggedId = null;
      }

      function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const li = e.target.closest('.todo-item');
        if (!li || li.dataset.id === draggedId) return;

        const rect = li.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        const side = e.clientY < midY ? 'before' : 'after';
        var prevSide = li.dataset.dropSide;
        if (prevSide === side) return;
        li.dataset.dropSide = side;
        document.querySelectorAll('.todo-item.drag-over-before, .todo-item.drag-over-after').forEach(function(el) {
          el.classList.remove('drag-over-before', 'drag-over-after');
        });
        li.classList.add('drag-over-' + side);
      }

      function onDragLeave(e) {
        var li = e.target.closest('.todo-item');
        if (!li) return;
        var related = e.relatedTarget;
        if (related && li.contains(related)) return;
        li.classList.remove('drag-over-before', 'drag-over-after');
        delete li.dataset.dropSide;
      }

      function onDrop(e) {
        e.preventDefault();
        const target = e.target.closest('.todo-item');
        if (!target) return;
        const targetId = target.dataset.id;
        if (targetId === draggedId) return;

        const side = target.dataset.dropSide || 'after';
        const fromIdx = todos.findIndex(t => t.id === draggedId);
        let toIdx = todos.findIndex(t => t.id === targetId);
        if (fromIdx === -1 || toIdx === -1) return;

        const [moved] = todos.splice(fromIdx, 1);
        toIdx = todos.findIndex(t => t.id === targetId);
        if (side === 'after' && toIdx < todos.length) toIdx++;
        todos.splice(toIdx, 0, moved);

        var draggedEl = todoList.querySelector('[data-id="' + draggedId + '"]');
        var targetEl = todoList.querySelector('[data-id="' + targetId + '"]');
        if (draggedEl) draggedEl.style.display = '';
        if (targetEl && draggedEl) {
          if (side === 'before') {
            targetEl.parentNode.insertBefore(draggedEl, targetEl);
          } else {
            targetEl.parentNode.insertBefore(draggedEl, targetEl.nextSibling);
          }
        }

        document.querySelectorAll('.todo-item.drag-over-before, .todo-item.drag-over-after').forEach(function(el) {
          el.classList.remove('drag-over-before', 'drag-over-after');
        });
        draggedId = null;
        renumberAndSave();
      }

      function renumberAndSave() {
        var items = todoList.querySelectorAll('.todo-item');
        items.forEach(function(li, i) {
          var num = li.querySelector('.todo-number');
          if (num) num.textContent = '#' + (i + 1);
        });
        updateUI();
        saveTodos();
      }

      function updateUI() {
        totalCount.textContent = todos.length;
        var done = todos.filter(function(t) { return t.done; }).length;
        var pending = todos.length - done;
        var pct = todos.length > 0 ? Math.round((done / todos.length) * 100) : 0;
        doneCount.textContent = done + ' done';
        pendingCount.textContent = pending + ' pending';
        completionPct.textContent = pct + '%';
        completionBar.style.width = pct + '%';
        emptyMsg.style.display = todos.length === 0 ? 'block' : 'none';
        var hasDone = todos.some(function(t) { return t.done; });
        deleteAllDoneBtn.classList.toggle('disabled', !hasDone);
        deleteAllDoneBtn.setAttribute('tabindex', !hasDone ? '-1' : '0');
        deleteAllDoneBtn.setAttribute('aria-disabled', !hasDone ? 'true' : 'false');
        deleteAllBtn.classList.toggle('disabled', todos.length === 0);
        deleteAllBtn.setAttribute('tabindex', todos.length === 0 ? '-1' : '0');
        deleteAllBtn.setAttribute('aria-disabled', todos.length === 0 ? 'true' : 'false');
        sortBtn.classList.toggle('disabled', todos.length < 2);
        sortBtn.setAttribute('tabindex', todos.length < 2 ? '-1' : '0');
        sortBtn.setAttribute('aria-disabled', todos.length < 2 ? 'true' : 'false');
        saveXmlBtn.classList.toggle('disabled', todos.length === 0);
        saveXmlBtn.setAttribute('tabindex', todos.length === 0 ? '-1' : '0');
        saveXmlBtn.setAttribute('aria-disabled', todos.length === 0 ? 'true' : 'false');
        reportBtn.classList.toggle('disabled', todos.length === 0);
        reportBtn.setAttribute('tabindex', todos.length === 0 ? '-1' : '0');
        reportBtn.setAttribute('aria-disabled', todos.length === 0 ? 'true' : 'false');
        var nt = document.getElementById('numbersToggle');
        if (nt) {
          nt.classList.toggle('disabled', todos.length === 0);
          nt.setAttribute('tabindex', todos.length === 0 ? '-1' : '0');
          nt.setAttribute('aria-disabled', todos.length === 0 ? 'true' : 'false');
        }
      }

      function genId() {
        try { return crypto.randomUUID(); } catch(e) { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9); }
      }

      function addTodo() {
        const text = todoInput.value.trim();
        if (!text) return;
        todos.push({ id: genId(), text: text, done: false });
        todoInput.value = '';
        todoInput.focus();
        render();
        announce('Task added');
      }

      function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        todo.done = !todo.done;
        var el = todoList.querySelector('[data-id="' + id + '"]');
        if (el) {
          var check = el.querySelector('.todo-check');
          var text = el.querySelector('.todo-text');
          if (check) {
            check.className = 'todo-check' + (todo.done ? ' checked' : '');
            check.setAttribute('aria-checked', todo.done);
          }
          if (text) { text.className = 'todo-text' + (todo.done ? ' done' : ''); }
        }
        updateUI();
        saveTodos();
        announce(todo.done ? 'Task completed' : 'Task uncompleted');
      }

      function deleteTodo(id) {
        var deletedText = (todos.find(function(t) { return t.id === id; }) || {}).text || 'Task';
        todos = todos.filter(t => t.id !== id);
        render();
        announce('Deleted: ' + deletedText);
        var remaining = todoList.querySelector('.todo-item');
        if (remaining) { remaining.focus(); }
        else { todoInput.focus(); }
      }

      async function deleteAllDone() {
        const done = todos.filter(t => t.done);
        if (!done.length) return;
        const ok = await modalConfirm('Delete completed tasks?');
        if (!ok) return;
        todos = todos.filter(t => !t.done);
        render();
        announce('Completed tasks deleted');
      }

      function setModalState(open) {
        var shell = document.querySelector('main.page-shell');
        var topBtn = document.getElementById('backToTop');
        if (shell) shell.inert = open;
        if (topBtn) topBtn.inert = open;
      }

      function modalAlert(msg) {
        return new Promise(resolve => {
          modalTitle.textContent = 'Todo List';
          modalMessage.textContent = msg;
          modalActions.innerHTML = '<button class="btn btn-sm" id="modalOkBtn">OK</button>';
          modalOverlay.classList.add('open');
          setModalState(true);
          var okBtn = document.getElementById('modalOkBtn');
          okBtn.focus();
          function close() { modalOverlay.classList.remove('open'); setModalState(false); }
          okBtn.addEventListener('click', function() { close(); resolve(); });
          modalOverlay.addEventListener('click', function handler(e) {
            if (e.target === modalOverlay) { close(); modalOverlay.removeEventListener('click', handler); resolve(); }
          });
          document.addEventListener('keydown', function handler(e) {
            if (e.key === 'Escape') { close(); resolve(); }
          }, { once: true });
        });
      }

      function modalPrompt(msg, defaultValue) {
        return new Promise(resolve => {
          modalTitle.textContent = 'Todo List';
          modalMessage.textContent = msg;
          modalActions.innerHTML = '<button class="btn btn-sm" id="modalPromptOkBtn">OK</button><button class="btn btn-sm btn-ghost" id="modalPromptCancelBtn">Cancel</button>';
          const input = document.createElement('input');
          input.type = 'text';
          input.value = defaultValue || '';
          input.style.cssText = 'width:100%;padding:0.5rem 0.75rem;border-radius:8px;border:1px solid var(--border-subtle);background:rgba(15,23,42,0.9);color:var(--text-main);font-size:0.9rem;outline:none;margin-bottom:1rem;box-sizing:border-box;';
          modalMessage.after(input);
          modalOverlay.classList.add('open');
          setModalState(true);
          input.focus();
          input.select();
          function cleanup() {
            modalOverlay.classList.remove('open');
            setModalState(false);
            input.remove();
          }
          document.getElementById('modalPromptOkBtn').addEventListener('click', function() {
            var val = input.value.trim();
            cleanup();
            resolve(val || defaultValue || null);
          });
          document.getElementById('modalPromptCancelBtn').addEventListener('click', function() {
            cleanup();
            resolve(null);
          });
          input.addEventListener('keydown', function handler(e) {
            if (e.key === 'Enter') {
              var val = input.value.trim();
              cleanup();
              input.removeEventListener('keydown', handler);
              resolve(val || defaultValue || null);
            }
            if (e.key === 'Escape') {
              e.stopPropagation();
              cleanup();
              input.removeEventListener('keydown', handler);
              resolve(null);
            }
          });
          modalOverlay.addEventListener('click', function handler(e) {
            if (e.target === modalOverlay) { cleanup(); modalOverlay.removeEventListener('click', handler); resolve(null); }
          });
          document.addEventListener('keydown', function handler(e) {
            if (e.key === 'Escape') { cleanup(); resolve(null); }
          }, { once: true });
        });
      }

      function modalConfirm(msg) {
        return new Promise(resolve => {
          modalTitle.textContent = 'Todo List';
          modalMessage.textContent = msg;
          modalActions.innerHTML = '<button class="btn btn-sm" id="modalConfirmBtn">OK</button><button class="btn btn-sm btn-ghost" id="modalCancelBtn">Cancel</button>';
          modalOverlay.classList.add('open');
          setModalState(true);
          var confirmBtn = document.getElementById('modalConfirmBtn');
          var cancelBtn = document.getElementById('modalCancelBtn');
          confirmBtn.focus();
          function close() { modalOverlay.classList.remove('open'); setModalState(false); }
          confirmBtn.addEventListener('click', function() { close(); resolve(true); });
          cancelBtn.addEventListener('click', function() { close(); resolve(false); });
          modalOverlay.addEventListener('click', function handler(e) {
            if (e.target === modalOverlay) { close(); modalOverlay.removeEventListener('click', handler); resolve(false); }
          });
          document.addEventListener('keydown', function handler(e) {
            if (e.key === 'Escape') { close(); resolve(false); }
          }, { once: true });
        });
      }

      async function saveXML() {
        const isJson = saveFormat === 'json';
        const ext = isJson ? 'json' : 'xml';
        const mime = isJson ? 'application/json' : 'application/xml';
        const name = await modalPrompt('Enter filename:', 'todos.' + ext);
        if (!name) return;
        let content;
        if (isJson) {
          content = JSON.stringify({ todos: todos }, null, 2);
        } else {
          let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<todos>\n';
          todos.forEach(t => {
            xml += '  <todo>\n';
            xml += '    <id>' + t.id + '</id>\n';
            xml += '    <text>' + escXml(t.text) + '</text>\n';
            xml += '    <done>' + t.done + '</done>\n';
            xml += '  </todo>\n';
          });
          xml += '</todos>';
          content = xml;
        }

        const blob = new Blob([content], { type: mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name.endsWith('.' + ext) ? name : name + '.' + ext;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }

      function escXml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
      }

      function loadXML() {
        xmlFileInput.value = '';
        xmlFileInput.click();
      }

      function parseXMLFile(file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const text = e.target.result;
            let loaded = [];

            if (file.name.endsWith('.json')) {
              const parsed = JSON.parse(text);
              const items = Array.isArray(parsed) ? parsed : (parsed.todos || []);
              items.forEach(item => {
                if (item.text !== undefined) {
                  loaded.push({
                    id: item.id || genId(),
                    text: item.text,
                    done: !!item.done
                  });
                }
              });
            } else {
              const parser = new DOMParser();
              const doc = parser.parseFromString(text, 'application/xml');
              const parseErr = doc.querySelector('parsererror');
              if (parseErr) throw new Error('Invalid XML: ' + parseErr.textContent);

              const items = doc.querySelectorAll('todos > todo');
              if (!items.length) throw new Error('No <todo> entries found under <todos>.');

              items.forEach(item => {
                const idEl = item.querySelector('id');
                const textEl = item.querySelector('text');
                const doneEl = item.querySelector('done');
                if (!idEl || !textEl || !doneEl) return;
                loaded.push({
                  id: idEl.textContent || genId(),
                  text: textEl.textContent,
                  done: doneEl.textContent === 'true'
                });
              });
            }

            if (!loaded.length) throw new Error('No valid todo items found.');

            todos = loaded;
            render();
            modalAlert('Loaded ' + loaded.length + ' tasks from "' + file.name + '".');
          } catch (err) {
            modalAlert('Failed to load file: ' + err.message);
          }
        };
        reader.readAsText(file);
      }

      async function createReport(fmt) {
        if (!todos.length) { modalAlert('No tasks to report.'); return; }
        const ext = fmt === 'txt' ? 'txt' : fmt === 'pdf' ? 'pdf' : 'html';
        const name = await modalPrompt('Enter report filename:', 'report.' + ext);
        if (!name) return;
        const done = todos.filter(t => t.done);
        const pending = todos.filter(t => !t.done);
        const date = new Date().toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        let content, mime;
        if (fmt === 'txt') {
          content = 'Todo Report\n';
          content += '='.repeat(40) + '\n';
          content += 'Total: ' + todos.length + '  |  Done: ' + done.length + '  |  Pending: ' + pending.length + '\n';
          content += '-'.repeat(40) + '\n\n';
          todos.forEach((t, i) => {
            var mark = t.done ? '[x]' : '[ ]';
            content += mark + ' #' + (i + 1) + ' ' + t.text + '\n';
          });
          content += '\n' + '-'.repeat(40) + '\n';
          content += 'Generated: ' + date + '\n';
          mime = 'text/plain';
        } else if (fmt === 'pdf') {
          content = buildHtmlReport(done, pending, date);
          mime = 'text/html';
        } else {
          content = buildHtmlReport(done, pending, date);
          mime = 'text/html';
        }

        if (fmt === 'pdf') {
          try {
            if (typeof window.jspdf === 'undefined') {
              await new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                s.crossOrigin = 'anonymous';
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'in', format: 'letter' });
            const margin = 0.75;
            const pageW = 8.5;
            const pageH = 11;
            let y = margin;
            const lineH = 0.28;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text('Todo Report', margin, y);
            y += 0.35;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text('Total: ' + todos.length + '    Done: ' + done.length + '    Pending: ' + pending.length, margin, y);
            y += 0.25;
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.01);
            doc.line(margin, y, pageW - margin, y);
            y += 0.2;
            doc.setFontSize(11);
            todos.forEach(function(t, i) {
              if (y + lineH > pageH - margin) {
                doc.addPage();
                y = margin;
              }
              var mark = t.done ? '[x] ' : '[ ] ';
              doc.setTextColor(t.done ? 150 : 50, t.done ? 150 : 50, t.done ? 150 : 50);
              doc.text(mark + '#' + (i + 1) + '  ' + t.text, margin, y);
              y += lineH;
            });
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(8);
            doc.text('Generated: ' + date, margin, pageH - 0.4);
            const fname = name.endsWith('.pdf') ? name : name + '.pdf';
            doc.save(fname);
          } catch(e) { modalAlert('PDF generation failed: ' + e.message); }
        } else {
          const blob = new Blob([content], { type: mime });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name.endsWith('.' + ext) ? name : name + '.' + ext;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(a.href);
        }
      }

      function buildHtmlReport(done, pending, date) {
        let c = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Todo Report</title>';
        c += '<style>body{font-family:system-ui,sans-serif;max-width:600px;margin:2rem auto;padding:0 1rem;color:#1f2937;background:#f9fafb;}';
        c += 'h1{font-size:1.5rem;}';
        c += '.summary{display:flex;gap:1rem;margin:1rem 0;}';
        c += '.summary div{flex:1;padding:1rem;border-radius:8px;text-align:center;font-weight:600;}';
        c += '.summary .total{background:#e5e7eb;}';
        c += '.summary .done{background:#d1fae5;color:#065f46;}';
        c += '.summary .pending{background:#fef3c7;color:#92400e;}';
        c += 'ul{padding:0;list-style:none;}';
        c += 'li{padding:0.5rem 0;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.5rem;}';
        c += 'li.done{text-decoration:line-through;color:#9ca3af;}';
        c += '.date{color:#6b7280;font-size:0.85rem;margin-top:1.5rem;}</style></head><body>';
        c += '<h1>Todo Report</h1>';
        c += '<div class="summary"><div class="total">Total: ' + (done.length + pending.length) + '</div><div class="done">Done: ' + done.length + '</div><div class="pending">Pending: ' + pending.length + '</div></div>';
        c += '<ul>';
        todos.forEach((t, i) => {
          c += '<li class="' + (t.done ? 'done' : '') + '">#' + (i + 1) + ' ' + escXml(t.text) + '</li>';
        });
        c += '</ul>';
        c += '<div class="date">Generated: ' + date + '</div></body></html>';
        return c;
      }

      addBtn.addEventListener('click', addTodo);
      deleteAllDoneBtn.addEventListener('click', deleteAllDone);
      document.getElementById('numbersToggle').addEventListener('click', function() {
        showNumbers = !showNumbers;
        try { localStorage.setItem('showNumbers', showNumbers); } catch {}
        render();
      });
      todoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });
      saveXmlBtn.addEventListener('click', saveXML);
      loadXmlBtn.addEventListener('click', loadXML);
      document.getElementById('deleteAllBtn').addEventListener('click', async function() {
        var ok = await modalConfirm('Delete all tasks?');
        if (!ok) return;
        todos = [];
        render();
        announce('All tasks deleted');
      });
      document.getElementById('sortBtn').addEventListener('click', async function() {
        if (todos.length < 2) return;
        var ok = await modalConfirm('Sort tasks alphabetically?');
        if (!ok) return;
        todos.sort(function(a, b) { return a.text.localeCompare(b.text); });
        render();
        announce('Tasks sorted alphabetically');
      });
      var reportDropdown = document.getElementById('reportDropdown');
      reportBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = reportDropdown.classList.toggle('open');
        reportBtn.setAttribute('aria-expanded', open);
      });
      reportBtn.setAttribute('aria-haspopup', 'true');
      reportBtn.setAttribute('aria-expanded', 'false');
      reportDropdown.querySelectorAll('.report-dropdown-item').forEach(function(item) {
        item.addEventListener('click', function() {
          reportDropdown.classList.remove('open');
          createReport(this.dataset.format);
        });
      });
      document.addEventListener('click', function() { reportDropdown.classList.remove('open'); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && reportDropdown.classList.contains('open')) {
          reportDropdown.classList.remove('open');
          reportBtn.setAttribute('aria-expanded', 'false');
          reportBtn.focus();
        }
      });
      xmlFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) parseXMLFile(e.target.files[0]);
      });

      document.getElementById('formatToggle').addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        saveFormat = btn.dataset.format;
        this.querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b === btn); });
      });

      searchTasks.addEventListener('input', function() {
        searchQuery = searchTasks.value.trim();
        render();
      });

      if (backToTop) {
        window.addEventListener('scroll', function() {
          backToTop.classList.toggle('visible', window.scrollY > 400);
        });
        backToTop.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      loadTodos();
      render();
      var fd = document.getElementById('footerDate');
      if (fd) fd.textContent = new Date(document.lastModified).toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    })();
  </script>
</body>
</html>
